name: Deploy JM Cruz L. Digital

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GITHUB_PAGES: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validar archivos de publicación
        id: check
        shell: bash
        run: |
          if [ -f index.html ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "index.html todavía no existe; se omite el despliegue."
          fi

  deploy:
    needs: validate
    if: needs.validate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
