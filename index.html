<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d">
<meta name="robots" content="index,follow">
<title>JM Cruz L. Digital</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06101d;color:#eef8ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:24px}.load{width:min(560px,100%);text-align:center}h1{font-size:clamp(1.9rem,7vw,3rem);line-height:1.08;margin:0 0 12px}p{font-size:clamp(.98rem,3.8vw,1.15rem);line-height:1.55;color:#a9bfd2;margin:0}.dots{display:flex;justify-content:center;gap:8px;margin-top:24px}.dot{width:9px;height:9px;border-radius:50%;background:#22dff3;animation:p 1s infinite ease-in-out}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes p{0%,100%{opacity:.28;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}button{border:1px solid rgba(34,223,243,.28);background:#0b2031;color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;font-size:1rem;display:none;margin:22px auto 0;cursor:pointer}
</style>
</head>
<body>
<main class="load" id="loadingView">
<h1>¡Bienvenido a JM Cruz L. Digital!</h1>
<p id="loadingText">Estamos preparando la tienda para ti.</p>
<div class="dots" id="dots" aria-label="Cargando"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<button id="retry" type="button">Reintentar</button>
</main>
<script>
(()=>{
'use strict';
const PARTS=['app-data/part-000.b64','app-data/part-001.b64','app-data/part-002.b64'];
const txt=document.getElementById('loadingText'), dots=document.getElementById('dots'), retry=document.getElementById('retry');
const fail=(e)=>{console.error(e);txt.textContent='No pudimos abrir la tienda en este momento. Intenta nuevamente.';dots.style.display='none';retry.style.display='block';};
retry.addEventListener('click',()=>location.reload());
async function boot(){
 try{
  if(!('DecompressionStream' in window)) throw new Error('unsupported');
  const pieces=await Promise.all(PARTS.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p);return r.text()})));
  const PAYLOAD=pieces.join('').replace(/\s+/g,'');
  const bin=atob(PAYLOAD), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip');
  const decompressed=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  const html=new TextDecoder('utf-8').decode(decompressed);
  if(!/^\s*<!doctype html/i.test(html) || !html.includes('JM Cruz L. Digital')) throw new Error('invalid');
  document.open();document.write(html);document.close();
 }catch(e){fail(e)}
}
boot();
})();
</script>
</body>
</html>
