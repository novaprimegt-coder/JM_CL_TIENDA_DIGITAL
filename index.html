<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101d"><title>JM Cruz L. Digital</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06101d;color:#eef8ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:24px}.load{width:min(560px,100%);text-align:center}h1{font-size:clamp(1.9rem,7vw,3rem);line-height:1.08;margin:0 0 12px}p{font-size:clamp(.98rem,3.8vw,1.15rem);line-height:1.55;color:#a9bfd2;margin:0}.dots{display:flex;justify-content:center;gap:8px;margin-top:24px}.dot{width:9px;height:9px;border-radius:50%;background:#22dff3;animation:p 1s infinite ease-in-out}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes p{0%,100%{opacity:.28}50%{opacity:1;transform:translateY(-5px)}}button{border:1px solid rgba(34,223,243,.28);background:#0b2031;color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;font-size:1rem;display:none;margin:22px auto 0}</style></head><body><main class="load"><h1>¡Bienvenido a JM Cruz L. Digital!</h1><p id="t">Estamos preparando tu experiencia. Gracias por visitarnos.</p><div class="dots" id="d"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><button id="r">Reintentar</button></main><script>(()=>{'use strict';const P=['app-data/part-000.b64','app-data/part-001.b64','app-data/part-002.b64'];const t=document.getElementById('t'),d=document.getElementById('d'),r=document.getElementById('r');r.onclick=()=>location.reload();function fail(e){console.error(e);t.textContent='Error de carga: '+(e&&e.message?e.message:'desconocido');d.style.display='none';r.style.display='block'}async function boot(){try{const rs=await Promise.all(P.map(async p=>{const x=await fetch(p+'?v=20260907-3',{cache:'no-store'});if(!x.ok)throw new Error(p+' HTTP '+x.status);return x.text()}));const s=rs.join('').replace(/\s+/g,'');let bin;try{bin=atob(s)}catch(e){throw new Error('Base64 inválido')}const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Navegador sin DecompressionStream');let ab;try{const ds=new DecompressionStream('gzip');ab=await new Response(new Blob([b]).stream().pipeThrough(ds)).arrayBuffer()}catch(e){throw new Error('GZIP inválido')}const html=new TextDecoder().decode(ab);if(!/<html[\s>]/i.test(html))throw new Error('HTML reconstruido inválido');document.open();document.write(html);document.close()}catch(e){fail(e)}}boot()})();</script></body></html>
