<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d">
<title>JM Cruz L. Digital</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06101d;color:#eef8ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:24px}.load{width:min(560px,100%);text-align:center}h1{font-size:clamp(1.9rem,7vw,3rem);line-height:1.08;margin:0 0 12px}p{font-size:clamp(.98rem,3.8vw,1.15rem);line-height:1.55;color:#a9bfd2;margin:0}.dots{display:flex;justify-content:center;gap:8px;margin-top:24px}.dot{width:9px;height:9px;border-radius:50%;background:#22dff3;animation:p 1s infinite ease-in-out}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes p{0%,100%{opacity:.28}50%{opacity:1;transform:translateY(-5px)}}button{border:1px solid rgba(34,223,243,.28);background:#0b2031;color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;font-size:1rem;display:none;margin:22px auto 0}</style>
</head><body><main class="load"><h1>¡Bienvenido a JM Cruz L. Digital!</h1><p id="t">Estamos preparando tu experiencia. Gracias por visitarnos.</p><div class="dots" id="d"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><button id="r">Reintentar</button></main>
<script>
(()=>{'use strict';const P=['app-data/part-000.b64','app-data/part-001.b64','app-data/part-002.b64'];const t=document.getElementById('t'),d=document.getElementById('d'),r=document.getElementById('r');r.onclick=()=>location.reload();function fail(e){console.error(e);t.textContent='No pudimos abrir la tienda en este momento. Intenta nuevamente.';d.style.display='none';r.style.display='block'}async function gunzip(bytes){if(!('DecompressionStream'in window))throw new Error('Este navegador no soporta descompresión nativa');const ds=new DecompressionStream('gzip');return await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer()}async function boot(){try{const rs=await Promise.all(P.map(async p=>{const q=p+'?v=20260907-2';const x=await fetch(q,{cache:'no-store'});if(!x.ok)throw new Error('No se pudo cargar '+p+' HTTP '+x.status);return await x.text()}));const s=rs.join('').replace(/\s+/g,'');if(!s)throw new Error('Payload vacío');let bin;try{bin=atob(s)}catch(e){throw new Error('Payload base64 inválido: '+e.message)}const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);const ab=await gunzip(b);const html=new TextDecoder().decode(ab);if(!/<html[\s>]/i.test(html)||!html.includes('JM Cruz L. Digital'))throw new Error('Contenido reconstruido inválido');document.open();document.write(html);document.close()}catch(e){fail(e)}}boot()})();
</script></body></html>
